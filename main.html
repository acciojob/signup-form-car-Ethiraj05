<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	    <form action="" method="post">

        <div class="items">
             <label for="name">Name</label>
            <input type="text" id="name" placeholder="Name" required>
        </div>        
        <div class="items">
             <label for="Email">Email</label>
            <input type="email" id="email" placeholder="email" required>
        </div>
        <div class="items">
             <label for="Gender">Gender</label>
             <input type="radio" name="Gender" id="male">male
            <input type="radio" name="Gender" id="female">female<br>
        </div>
        <div class="items">
             <label for="cars">Car Brands</label>
            <input type="select" id="cars" placeholder="--Please choose an option" required>
        </div>
        <div class="items">
             <label for="age">Age</label>
            <input type="number" id="age" placeholder="age" required>
        </div>
        <div class="items">
             <label for="dob">DOB</label>
            <input type="date" id="dob"  required>
        </div>
        <div class="items">
             <label for="tel">Phone Number</label>
            <input type="tel" id="tel" placeholder="xxx-xxx-xxxx" >
        </div>
        <div class="items">
             <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" required>
        </div>
        <div class="items">
             <label for="tos">I agree to the TOS</label>
            <input type="checkbox" id="tos"  required>
        </div>
        <button type="submit">submit</button>
    </form>
</body>

</body>

</html>
